template_id: lead-ad-alert
name: Lead-ad alert
description: Facebook or Instagram lead ad form → contact created or updated in HubSpot → email to the sales person within a minute.
version: 1.0.0
activepieces: 0.92.3
pieces:
  - name: "@activepieces/piece-facebook-leads"
    version: 0.5.1
  - name: "@activepieces/piece-hubspot"
    version: 0.13.1
  - name: "@activepieces/piece-gmail"
    version: 0.18.1
placeholders:
  - key: SALES_EMAIL
    description: Who gets each new lead
    example: sales@example.com
  - key: BUSINESS_NAME
    description: Used as sender name
    example: Example Dental
connections:
  - piece: "@activepieces/piece-facebook-leads"
    purpose: receive leads from the client's Facebook page (and Instagram ads using its forms)
    options:
      - "Try another method → Custom OAuth2 App (Advanced) only: a Meta app per client stack, plus its app secret in channels.env and client.yaml app_webhooks (see README)"
  - piece: "@activepieces/piece-hubspot"
    purpose: create or update the lead as a HubSpot contact
    options:
      - "Connect: Activepieces' HubSpot sign-in"
      - "Try another method → Private App Access Token: a HubSpot private app with contacts read/write scopes; no third party"
  - piece: "@activepieces/piece-gmail"
    purpose: email the sales person from the client's mailbox
    options:
      - "Connect: Activepieces' Google sign-in (tick every permission box on Google's screen)"
      - "Try another method → Custom OAuth2 App (Advanced): the client's own Google Cloud OAuth app, redirect https://<domain>/redirect; no third party"
failure: fail-run
test:
  runs:
    - payload: test/lead.json
      expect: SUCCEEDED
      ran: [step_2, step_3]
    - payload: test/lead-no-email.json
      expect: FAILED
      not_ran: [step_2]
